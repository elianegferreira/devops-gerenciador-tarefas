services:
  web:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(id -u)\" -ne 0 && wget -q -T 2 -O - http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 2s
      timeout: 3s
      retries: 15

  verificacao:
    image: node:22-alpine
    profiles: ["verificacao"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      APP_URL: http://web:8080
    volumes:
      - ./scripts/verify-http.mjs:/verify-http.mjs:ro
    command: ["node", "/verify-http.mjs"]
