name: CI/CD (Fase 2)
on:
  push:
    branches: [fase-2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-e-construir:
    if: github.ref == 'refs/heads/fase-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  validar-terraform:
    if: github.ref == 'refs/heads/fase-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  validar-container:
    needs: testar-e-construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar orquestração com Docker Compose
        run: sh scripts/test-compose.sh

  publicar-no-render:
    needs: [validar-container, validar-terraform]
    if: github.ref == 'refs/heads/fase-2' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    concurrency:
      group: render-fase-2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o commit testado e verificar a aplicação
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: bash scripts/deploy-render.sh
