name: Integração Contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-e-construir:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes automatizados
        run: npm test
      - name: Gerar build
        run: npm run build
      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: site-estatico
          path: dist/
